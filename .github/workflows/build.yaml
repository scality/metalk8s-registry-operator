name: "Build"

on:
  workflow_call:
    inputs:
      is-development:
        description: "Whether the build is for development purposes or not"
        required: false
        default: true
        type: boolean
      is-latest:
        description: "Whether the build is for the latest tag or not"
        required: false
        default: false
        type: boolean
      is-stable:
        description: "Whether the build is for a stable release or not"
        required: false
        default: false
        type: boolean
    outputs:
      image_tag:
        description: "The primary image tag produced by the build"
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # NOTE: We fetch depth so that we can put the right `GIT` reference
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to the registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        # If `is-development` then suffix tag with `-dev`
        # If `is-latest` then add `latest` tag
        # If not `is-stable` then suffix `-dev` to `latest
        run: |
          version="$(git describe --tags --always --dirty --match='v[0-9]*')${{ inputs.is-development && '-dev' || '' }}"
          image_tag="ghcr.io/${{ github.repository }}:${version}"
          tags="${image_tag}"
          if [ "${{ inputs.is-latest }}" = "true" ]; then
            tags="$tags,ghcr.io/${{ github.repository }}:latest${{ ! inputs.is-stable && '-dev' || '' }}"
          fi
          echo "tags=$tags" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "image_tag=$image_tag" >> $GITHUB_OUTPUT
      - name: Setup Private Go Environment
        uses: ./.github/actions/setup-go
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}
      - name: Download Manifests
        run: |
          make download-manifests
        env:
          GIT_ACCESS_TOKEN: ${{ secrets.GIT_ACCESS_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args:
            APPLICATION_VERSION=${{ steps.tags.outputs.version }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=metalk8s-registry-operator
          cache-to: type=gha,mode=max,scope=metalk8s-registry-operator
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GIT_ACCESS_TOKEN }}