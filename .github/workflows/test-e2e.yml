name: E2E Tests

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        description: "tag of the registry operator image to use when deploying"
        required: true

permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Private Go Environment
        uses: ./.github/actions/setup-go
        with:
          token: ${{ secrets.GIT_ACCESS_TOKEN }}

      - name: Deploy the kubernetes cluster
        uses: ./.github/actions/spawn
        with:
            aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
            aws_region: ${{ secrets.AWS_REGION }}
            artifacts_user: ${{ secrets.ARTIFACTS_USER }}
            artifacts_password: ${{ secrets.ARTIFACTS_PASSWORD }}

      - name: Export KUBECONFIG for subsequent steps
        run: echo "KUBECONFIG=$(pwd)/kubeconfig" >> "$GITHUB_ENV"

      - name: Build the installer
        id: build-installer
        run: |
          go mod tidy
          make build-installer IMG="${{ inputs.image_tag }}"
          echo "installer=$(realpath ./dist/install.yaml)" >> $GITHUB_OUTPUT

      - name: deploy the Registry operator
        uses: ./.github/actions/deploy
        with:
            manifest: ${{ steps.build-installer.outputs.installer }}
            pull_secret: ${{ secrets.GIT_ACCESS_TOKEN }}
            registry_nodes: "node-2 node-3"

      - name: Running Test e2e
        run: make test-e2e

  destroy:
    needs:
      - test-e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Destroy platform
        uses: ./.github/actions/destroy
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          aws_region: ${{ secrets.AWS_REGION }}
