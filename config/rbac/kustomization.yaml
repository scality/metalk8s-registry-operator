resources:
# All RBAC will be applied under this service account in
# the deployment namespace. You may comment out this resource
# if your manager will use a service account that exists at
# runtime. Be sure to update RoleBinding and ClusterRoleBinding
# subjects if changing service account names.
- service_account.yaml
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# The following RBAC configurations grant the operator ServiceAccount
# the token/subjectaccessreview permissions it needs to be *allowed* to
# install the metalk8s-registry-node-agent bundle: RNA ships a
# `metrics-auth-role` ClusterRole containing these verbs, and Kubernetes
# RBAC privilege-escalation prevention requires the operator to hold
# every permission that any ClusterRole it applies grants. Even when
# the operator's own /metrics endpoint is disabled, these must stay on
# for Registry reconciliation to succeed.
# More info: https://book.kubebuilder.io/reference/metrics.html
- metrics_auth_role.yaml
- metrics_auth_role_binding.yaml
# metrics_reader_role.yaml is a standalone helper ClusterRole intended
# to be bound to human callers of the operator /metrics endpoint. The
# operator itself neither uses nor installs it, so keep it off while
# metrics are unplugged.
# - metrics_reader_role.yaml
# For each CRD, "Admin", "Editor" and "Viewer" roles are scaffolded by
# default, aiding admins in cluster management. Those roles are
# not used by the metalk8s-registry-operator itself. You can comment the following lines
# if you do not want those helpers be installed with your Project.
- mirrorconfig_admin_role.yaml
- mirrorconfig_editor_role.yaml
- mirrorconfig_viewer_role.yaml
- registry_admin_role.yaml
- registry_editor_role.yaml
- registry_viewer_role.yaml
- solutionarchive_admin_role.yaml
- solutionarchive_editor_role.yaml
- solutionarchive_viewer_role.yaml
# controller-gen does not deal with nonResourceURLs, so we hand-write a
# ClusterRoleBinding that grants the operator SA the `/metrics` GET
# nonResourceURL verb. This is required so the operator is allowed to
# install the metalk8s-registry-node-agent `metrics-reader` ClusterRole
# (RBAC privilege-escalation prevention), not because the operator itself
# reads /metrics.
- additional_rbac.yaml

